name: Verify all EEG baselines on archived true eight-subject epochs

on:
  push:
    branches: ["experiments/mi-three-run-strongbaselines-*"]
    paths: [".github/workflows/verify_three_run_real8.yml", "ffseeg_physionet/verify_three_run_real8.py"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  eight-subject-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PYTHONUNBUFFERED: "1"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install scientific runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==1.26.4 scipy==1.14.1 pandas==2.2.3 scikit-learn==1.5.2 mne==1.10.2 edfio pyriemann==0.7
      - name: Retrieve previously verified 8-subject three-run real EEG waveforms
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p input
          curl -fLsS --retry 5 --retry-all-errors --retry-delay 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/12124756879/zip" \
            -o input/verified_8subj.zip
          unzip -t input/verified_8subj.zip
          unzip -q input/verified_8subj.zip -d input
          test -s input/outputs/preflight/real_epochs_float32.npz
          test -s input/outputs/preflight/events.csv
          sha256sum input/verified_8subj.zip > input_sha256.txt
      - name: Check real EEG alignment and train eight baselines with independent folds
        shell: bash
        run: |
          set -euo pipefail
          python ffseeg_physionet/verify_three_run_real8.py \
            --inputs input/outputs/preflight --out outputs/real8 --epochs 30 \
            2>&1 | tee real8.log
          grep -q "REAL_8_EIGHT_MODEL_INTEGRATION_OK" real8.log
          test -s outputs/real8/oof_predictions.csv
          test -s outputs/real8/paired_subject_exploratory.csv
      - name: Save all outputs and any failure diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real_eeg_8subjects_3runs_model_integration
          path: |
            outputs/
            input_sha256.txt
            real8.log
          retention-days: 30
          if-no-files-found: warn
