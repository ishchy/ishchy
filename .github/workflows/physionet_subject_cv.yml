name: PhysioNet EEGMMIDB subject held-out comparison

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/physionet_subject_cv.yml'
  workflow_dispatch:
    inputs:
      subjects_end:
        description: 'Last subject ID (109 for full study)'
        required: true
        default: '109'
        type: string
      folds:
        description: 'Subject-held-out folds (10 for full study)'
        required: true
        default: '10'
        type: string
      epochs:
        description: 'Maximum epochs per training stage'
        required: true
        default: '100'
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      PYTHONUNBUFFERED: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - name: Checkout reproducible source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU training and EEG dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==1.26.4 scipy==1.14.1 pandas==2.2.3 scikit-learn==1.5.2 mne==1.9.0 edfio==0.4.5
      - name: Synthetic code-only smoke check (NOT a paper result)
        run: |
          python ffseeg_physionet/physionet_extended_cv.py --smoke --n-splits 2 --max-epochs 2 --out outputs/synthetic_smoke
          grep -q 'SYNTHETIC SMOKE TEST' outputs/synthetic_smoke/RUN_COMPLETE.txt
      - name: Download real PhysioNet EDF and run subject-held-out comparison
        shell: bash
        run: |
          set -o pipefail
          python ffseeg_physionet/physionet_extended_cv.py \
            --subject-end "${{ inputs.subjects_end || '109' }}" \
            --n-splits "${{ inputs.folds || '10' }}" \
            --max-epochs "${{ inputs.epochs || '100' }}" \
            --out outputs/physionet_full \
            --cache-dir cache/eegmmidb 2>&1 | tee subject_cv.log
          grep -q 'Real EEG result' outputs/physionet_full/RUN_COMPLETE.txt
      - name: Record audit hashes
        if: always()
        shell: bash
        run: |
          find outputs/physionet_full -type f -print0 2>/dev/null | sort -z | xargs -0 -r sha256sum > SHA256SUMS.txt
      - name: Upload results, logs and hashes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: physionet_subject_cv_${{ github.run_number }}
          path: |
            outputs/physionet_full/
            subject_cv.log
            SHA256SUMS.txt
          if-no-files-found: warn
          retention-days: 30
